[package]
name = "speech"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "speech_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# `tauri dev` runs the debug build; unoptimized, pitch analysis alone took
# ~350ms per 10s utterance. Light opts for our crate, full for deps.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }

whisper-rs = { version = "0.14", features = ["vulkan"] }
ort = "=2.0.0-rc.13" # ONNX Runtime bindings for Rust
cpal = "0.15"       # cross-platform audio capture
ndarray = "0.15"
serde_json = "1.0.151"
# Model downloads; same TLS setup ort-sys already builds it with.
ureq = { version = "3", default-features = false, features = ["native-tls"] }

