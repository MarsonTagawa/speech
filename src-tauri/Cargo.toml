[package]
name = "speech"
version = "0.1.0"
description = "A local speech-fluency trainer"
authors = ["MarsonTagawa"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "speech_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# `tauri dev` runs the debug build; unoptimized, pitch analysis alone took
# ~350ms per 10s utterance. Light opts for our crate, full for deps.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1" # src/ggml_guard.cpp; already in the tree via whisper-rs-sys

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }

ort = "=2.0.0-rc.13" # ONNX Runtime bindings for Rust
cpal = "0.15"       # cross-platform audio capture
ndarray = "0.15"
serde_json = "1.0.151"
nokhwa = { version = "0.10", features = ["input-native"] } # camera (v4l2 on Linux)
jpeg-encoder = "0.7" # camera preview frames for the webview
# Model downloads; same TLS setup ort-sys already builds it with.
ureq = { version = "3", default-features = false, features = ["native-tls"] }
# Google sign-in (drive.rs): PKCE and the loopback redirect. Versions already in the tree.
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"
url = "2"
# Screen OCR (screen/ocr.rs): reading off the slides from the screen replay.
# ponytail: 0.11 / rten 0.22 because rten-gemm ≥ 0.24 doesn't build on the flake's
# rustc 1.98.1 (AVX-512 VNNI intrinsic vs nixpkgs LLVM); move up once it does.
ocrs = "=0.11.0"
rten = "=0.22.1" # the version ocrs 0.11.0 depends on
nnnoiseless = { version = "0.5", default-features = false } # Settings → Voice isolation (RNNoise)
# Session video export (export.rs) decodes replay JPEGs to composite them, as do the
# vision golden tests (src/vision/*_golden). nokhwa already builds it.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# Settings → Updates (update.rs). 2.13+ needs tauri 2.12, whose webview2-com no
# longer matches the one screenshot.rs uses. native-tls like ureq above.
tauri-plugin-updater = { version = "~2.12", default-features = false, features = ["native-tls", "zip", "system-proxy"] }


# Report screenshot (screenshot.rs): each platform's webview snapshot and
# clipboard. Same versions tauri/wry already build with.
# whisper.cpp on the GPU: Vulkan here and on Windows (needs the Vulkan SDK to build), Metal on macOS.
[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16", features = ["vulkan"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "=2.0.2"
# Screen replay (screen/stream.rs): the ScreenCast portal and its PipeWire stream.
ashpd = { version = "0.13", features = ["screencast"] }
pipewire = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] } # ashpd's runtime (see stream.rs RT)

# Screen replay on macOS/Windows: ScreenCaptureKit / Windows Graphics Capture.
[target.'cfg(not(target_os = "linux"))'.dependencies]
# wgc: Windows Graphics Capture. xcap's default Windows recorder (DXGI duplication)
# never releases its duplication on stop, so the next start fails with
# E_INVALIDARG (0x80070057, "already duplicating this output").
xcap = { version = "0.9.8", features = ["wgc"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] } # Macs have no Vulkan
objc2 = "0.6"
block2 = "0.6"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSPasteboard", "NSResponder", "NSScreen", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKSnapshotConfiguration"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"
